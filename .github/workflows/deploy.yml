name: Deploy (build image + provision infra)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deployments (or two Terraform applies) at the same time
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_FILE: envs/dev.tfvars
  TF_IN_AUTOMATION: "true"
  IMAGE_TAG: ${{ github.sha }}
  # Must match cpu_architecture in the tfvars (linux/arm64 <-> ARM64)
  IMAGE_PLATFORM: linux/amd64

jobs:
  # -------------------------------------------------------------------------
  # 1. Unit tests
  # -------------------------------------------------------------------------
  test:
    name: Test application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B verify

  # -------------------------------------------------------------------------
  # 2. ECR -> build & push image -> full Terraform apply -> smoke test
  # -------------------------------------------------------------------------
  deploy:
    name: Build image & provision infrastructure
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16.0"
          terraform_wrapper: false # so `terraform output -raw` returns clean values

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      # Step A: make sure the ECR repository exists before pushing to it.
      # On the very first run this creates it; afterwards it is a no-op.
      - name: Terraform apply (ECR only)
        run: |
          terraform apply -input=false -auto-approve \
            -var-file="${TF_VAR_FILE}" \
            -var="image_tag=${IMAGE_TAG}" \
            -target=module.ecr

      - name: Read ECR repository
        id: ecr
        run: |
          echo "url=$(terraform output -raw ecr_repository_url)"   >> "$GITHUB_OUTPUT"
          echo "name=$(terraform output -raw ecr_repository_name)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable: skip the build if this commit was already pushed
      # (e.g. when re-running a failed job).
      - name: Check if image already exists
        id: image
        run: |
          if aws ecr describe-images \
               --repository-name "${{ steps.ecr.outputs.name }}" \
               --image-ids imageTag="${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${IMAGE_TAG} already in ECR, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # Step B: build the Spring Boot image and push it tagged with the commit SHA
      - name: Build and push image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.url }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step C: provision/update everything else and roll out the new image.
      # The ECS service uses wait_for_steady_state, so this step fails if the
      # new tasks never become healthy (the circuit breaker rolls them back).
      - name: Terraform plan
        run: |
          terraform plan -input=false \
            -var-file="${TF_VAR_FILE}" \
            -var="image_tag=${IMAGE_TAG}" \
            -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read outputs
        id: tf
        run: |
          echo "alb_url=$(terraform output -raw alb_url)"           >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw ecs_cluster_name)"  >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw ecs_service_name)"  >> "$GITHUB_OUTPUT"

      # Step D: smoke test through the public ALB DNS name
      - name: Smoke test
        run: |
          URL="${{ steps.tf.outputs.alb_url }}"
          echo "Testing ${URL}/actuator/health"
          for i in $(seq 1 30); do
            if curl -fsS "${URL}/actuator/health" | grep -q '"UP"'; then
              echo "Health check OK"
              curl -fsS "${URL}/api/info"; echo
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 10s..."
            sleep 10
          done
          echo "Application did not become healthy" >&2
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Region | \`${AWS_REGION}\` |"
            echo "| ECS cluster / service | \`${{ steps.tf.outputs.cluster }}\` / \`${{ steps.tf.outputs.service }}\` |"
            echo "| URL | ${{ steps.tf.outputs.alb_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
